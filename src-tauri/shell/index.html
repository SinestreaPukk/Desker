<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desker</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #fafaff;
        color: #23222b;
        padding: 2rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #141319; color: #eceaf5; }
        .card { background: #23222c !important; border-color: #35343f !important; }
        input { background: #141319 !important; color: #eceaf5 !important; border-color: #35343f !important; }
      }
      .card {
        width: 100%;
        max-width: 27rem;
        background: #fff;
        border: 1px solid #e3e2ef;
        border-radius: 14px;
        padding: 1.75rem;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
      }
      .mark {
        width: 48px; height: 48px; margin: 0 auto 1rem;
        display: block;
      }
      h1 { font-size: 1.05rem; margin: 0 0 0.4rem; letter-spacing: -0.01em; }
      p { font-size: 0.85rem; line-height: 1.6; margin: 0 0 1.1rem; opacity: 0.75; }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.78rem; background: rgba(24, 0, 173, 0.09);
        padding: 0.15em 0.4em; border-radius: 5px;
      }
      form { display: flex; gap: 0.5rem; }
      input {
        flex: 1; min-width: 0; padding: 0.55rem 0.7rem; font-size: 0.85rem;
        border: 1px solid #cfcee0; border-radius: 8px; background: #fff; color: inherit;
      }
      button {
        padding: 0.55rem 1rem; font-size: 0.85rem; font-weight: 600;
        border: none; border-radius: 8px; background: #1800AD; color: #fff; cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { margin-top: 0.9rem; font-size: 0.78rem; min-height: 1.2em; }
      .status.error { color: #b3281f; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="mark.png" alt="" width="48" height="48" />
      <h1>Connecting to your Desker server</h1>
      <p>
        The desktop app is a native window onto a running Desker server. Start one
        with <code>docker compose up</code> or <code>npm run dev</code>, or point
        this window at a deployed URL.
      </p>

      <form id="connect">
        <label for="url" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Server URL</label>
        <input id="url" name="url" type="url" required placeholder="http://localhost:3000" />
        <button type="submit" id="go">Connect</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const input = document.getElementById("url");
      const status = document.getElementById("status");
      const button = document.getElementById("go");

      const invoke = window.__TAURI__?.core?.invoke;
      const stored = localStorage.getItem("desker:url");

      async function defaultUrl() {
        if (stored) return stored;
        if (invoke) {
          try {
            return await invoke("desker_server_url");
          } catch (_) {}
        }
        return "http://localhost:3000";
      }

      function setStatus(text, isError) {
        status.textContent = text;
        status.className = isError ? "status error" : "status";
      }

      async function connect(url, quiet) {
        const base = url.replace(/\/+$/, "");
        if (!quiet) setStatus("Checking " + base + "…", false);
        button.disabled = true;
        try {
          const response = await fetch(base + "/api/health", { cache: "no-store" });
          if (!response.ok) throw new Error("Server responded " + response.status);
          const health = await response.json();
          if (!health.ok) throw new Error("Server reports its database is unreachable.");
          localStorage.setItem("desker:url", base);
          window.location.replace(base);
        } catch (error) {
          if (!quiet) {
            setStatus(
              "Could not reach a Desker server at " + base + ". " +
                "Start the server, then try again.",
              true
            );
          } else {
            setStatus("", false);
          }
        } finally {
          button.disabled = false;
        }
      }

      document.getElementById("connect").addEventListener("submit", function (event) {
        event.preventDefault();
        connect(input.value);
      });

      defaultUrl().then(function (url) {
        input.value = url;
        // Try silently on launch so a running server opens straight away.
        connect(url, true);
      });
    </script>
  </body>
</html>
