name: CI

on:
  # Every push, on every branch: lint and typecheck must never lag a commit.
  push:
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prisma Client must exist before anything typechecks.
      - run: npm run db:generate
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:contrast
      - run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      INNGEST_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./e2e.db
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./e2e.db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATABASE_PROVIDER: sqlite
          E2E_DATABASE_URL: file:./e2e.db
          AUTH_SECRET: ci-secret-not-for-production
          # Chat specs skip themselves when this is absent. Add the secret to
          # the repository to exercise the live model path in CI.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop:
    name: Desktop build (${{ matrix.os }})
    # A Tauri bundle can only be produced on its target OS, so "works on Mac and
    # Windows" is demonstrated by this matrix rather than by one developer's
    # machine. Artifacts are downloadable from the run summary.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: roster-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
